<!doctype html>
<html>
<head><meta charset="utf-8"/>
<style>body{margin:0;background:#20242a;}</style>
<script type="importmap">
 { "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/" } }
</script>
</head>
<body>
<!--
  Rig inspector. Loads a catalog bot THROUGH THE GAME LOADER and measures it in
  GAME space with the model grounded, which is the only space any of these
  numbers mean anything in. Drive it with tools/rig-inspect.mjs.

  Why not tools/viewer.html: that one shows a raw GLB. Everything that has gone
  wrong with a bot's rig went wrong in the normalization — models built upside
  down, a Tripo support stand holding the chassis half a foot off the floor, an
  arm whose rest angle was picked off the unrotated part. None of it is visible
  before the loader runs.
-->
<script type="module">
import * as THREE from "three";
import { CATALOG } from "/src/assets/catalog.js";
import { loadBotModel } from "/src/assets/models.js";

const W = 760, H = 600;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x20242a);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 2.2));
const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(3, 5, 2); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 1.2); fill.position.set(-3, -2, -3); scene.add(fill);
const camera = new THREE.PerspectiveCamera(45, W / H, 0.01, 400);

// Floor grid at y=0 so "does it sit on the ground" is readable in a screenshot.
const grid = new THREE.GridHelper(20, 40, 0x778899, 0x3a4048);
scene.add(grid);
// Axis marks: red = +X (bot's right), blue = +Z (BACK, since forward is -Z).
const ax = new THREE.AxesHelper(2.5); scene.add(ax);

let current = null;         // { group, parts, spec }
const overlays = new THREE.Group(); scene.add(overlays);

// --- exact vertex measurement (never Box3.setFromObject on a rotated node) ---
// Only vertices the INDEX buffer actually draws count. glb-carve moves triangles
// between parts and compacts accessors, which leaves orphan positions behind in
// the donor mesh; walking the raw position attribute reads Copperhead's drum as
// 3.0ft wide when the triangles that draw it span 1.1ft.
function eachVertex(root, fn) {
  root.updateWorldMatrix(true, true);
  const v = new THREE.Vector3();
  root.traverse((node) => {
    if (!node.isMesh || !node.geometry?.attributes?.position) return;
    const pos = node.geometry.attributes.position;
    const index = node.geometry.index;
    node.updateWorldMatrix(true, false);
    const count = index ? index.count : pos.count;
    for (let i = 0; i < count; i += 1) {
      v.fromBufferAttribute(pos, index ? index.getX(i) : i).applyMatrix4(node.matrixWorld);
      fn(v);
    }
  });
}

function vbox(root) {
  let n = 0;
  const min = [Infinity, Infinity, Infinity];
  const max = [-Infinity, -Infinity, -Infinity];
  eachVertex(root, (v) => {
    n += 1;
    min[0] = Math.min(min[0], v.x); max[0] = Math.max(max[0], v.x);
    min[1] = Math.min(min[1], v.y); max[1] = Math.max(max[1], v.y);
    min[2] = Math.min(min[2], v.z); max[2] = Math.max(max[2], v.z);
  });
  if (!n) return null;
  return { n, min, max, size: [max[0] - min[0], max[1] - min[1], max[2] - min[2]] };
}

// Best-fit axle for a spinner: the point in the rotation plane that minimises
// the MAXIMUM vertex distance, i.e. the centre of the smallest circle the part
// sweeps. A blade hung off the wrong point sweeps a circle far bigger than
// itself and visibly orbits instead of spinning; this is the point it wants.
// Iterative 1-centre (Badoyu-Clarkson): walk the centre toward the current
// farthest vertex by 1/(i+1). Converges fast and needs no hull.
window.__axle = (partName) => {
  const root = partName
    ? (() => { let f = null; current.parts.weapon.traverse((c) => { if (!f && c.name === partName) f = c; }); return f; })()
    : current.parts.weapon;
  if (!root) return null;
  const spec = current.spec;
  const a = new THREE.Vector3(spec.weapon.axis?.x ?? 1, spec.weapon.axis?.y ?? 0, spec.weapon.axis?.z ?? 0).normalize();
  const pts = [];
  eachVertex(root, (v) => pts.push(v.clone()));
  if (!pts.length) return null;
  // Work in the plane: strip the axial component relative to an arbitrary origin.
  const flat = (v) => v.clone().addScaledVector(a, -v.dot(a));
  const centre = flat(pts[0]).clone();
  for (let i = 0; i < 4000; i += 1) {
    let far = null;
    let best = -1;
    for (const p of pts) {
      const d = flat(p).distanceTo(centre);
      if (d > best) { best = d; far = p; }
    }
    centre.lerp(flat(far), 1 / (i + 2));
  }
  let radius = 0;
  for (const p of pts) radius = Math.max(radius, flat(p).distanceTo(centre));
  // Put the axial coordinate back at the part's own mid-thickness.
  let lo = Infinity, hi = -Infinity;
  for (const p of pts) { const t = p.dot(a); lo = Math.min(lo, t); hi = Math.max(hi, t); }
  const axle = centre.clone().addScaledVector(a, (lo + hi) / 2);
  return { axle: axle.toArray(), radius };
};

// Max perpendicular distance from the spin axis through `pivot` over every vertex.
function sweptRadius(root, pivot, axis) {
  const a = new THREE.Vector3(axis.x, axis.y, axis.z).normalize();
  const p = new THREE.Vector3(pivot.x, pivot.y, pivot.z);
  const d = new THREE.Vector3();
  let r = 0;
  let far = null;
  eachVertex(root, (v) => {
    d.copy(v).sub(p);
    d.addScaledVector(a, -d.dot(a));
    const len = d.length();
    if (len > r) { r = len; far = [v.x, v.y, v.z]; }
  });
  return { radius: r, far };
}

// Occupancy histogram: how much of the bot's volume sits in each Z slab and
// each Y slab. Reveals hollow shells and where a wedge nose actually starts.
function profile(root, axisIndex, bins = 24) {
  const b = vbox(root);
  if (!b) return null;
  const lo = b.min[axisIndex], hi = b.max[axisIndex];
  const span = Math.max(1e-6, hi - lo);
  const counts = new Array(bins).fill(0);
  const other = axisIndex === 2 ? 1 : 2;
  const oMin = new Array(bins).fill(Infinity);
  const oMax = new Array(bins).fill(-Infinity);
  const xMin = new Array(bins).fill(Infinity);
  const xMax = new Array(bins).fill(-Infinity);
  eachVertex(root, (v) => {
    const t = ([v.x, v.y, v.z][axisIndex] - lo) / span;
    const i = Math.min(bins - 1, Math.max(0, Math.floor(t * bins)));
    counts[i] += 1;
    const o = [v.x, v.y, v.z][other];
    oMin[i] = Math.min(oMin[i], o); oMax[i] = Math.max(oMax[i], o);
    xMin[i] = Math.min(xMin[i], v.x); xMax[i] = Math.max(xMax[i], v.x);
  });
  return { lo, hi, bins, counts, oMin, oMax, xMin, xMax };
}

window.__load = async (id) => {
  if (current) { scene.remove(current.group); current = null; }
  overlays.clear();
  // Catalog paths are relative to index.html at the repo root; this page is one
  // directory down, so re-root them rather than editing the catalog.
  const spec = { ...CATALOG[id], modelPath: CATALOG[id].modelPath.replace(/^\.\//, "/") };
  const loaded = await loadBotModel(spec);
  scene.add(loaded.group);
  current = { ...loaded, spec };
  const parts = loaded.parts;
  const out = {
    id,
    modelYaw: spec.modelYaw ?? 0,
    modelRoll: spec.modelRoll ?? 0,
    modelScale: spec.modelScale ?? null,
    catalogRadius: spec.weapon?.radius ?? null,
    bodyDims: spec.bodyDims,
    weaponIsPlaceholder: loaded.weaponIsPlaceholder,
    all: vbox(loaded.group),
    body: vbox(parts.body),
    bodyIsPlaceholder: parts.body.name === "placeholderBody",
    weapon: null,
    weaponPivot: null,
    weaponSub: null,
    wheels: parts.wheels.map((w) => {
      const b = vbox(w);
      return { pos: [w.position.x, w.position.y, w.position.z], spinIndex: w.userData.spinIndex, box: b };
    }),
    aux: {},
  };
  // The normalization the loader applied, so a game-space region measured here
  // can be handed to glb-carve, which works in the GLB's own space.
  parts.body.updateWorldMatrix(true, false);
  out.bodyMatrix = parts.body.matrixWorld.toArray();
  window.__toGlb = (p) => {
    const m = new THREE.Matrix4().fromArray(out.bodyMatrix).invert();
    return new THREE.Vector3(p[0], p[1], p[2]).applyMatrix4(m).toArray();
  };
  if (parts.weapon) {
    out.weaponPivot = [parts.weapon.position.x, parts.weapon.position.y, parts.weapon.position.z];
    out.weapon = vbox(parts.weapon);
    const axis = spec.weapon.axis || { x: 1, y: 0, z: 0 };
    out.swept = sweptRadius(parts.weapon, parts.weapon.position, axis);
    out.weaponMeshes = [];
    parts.weapon.traverse((n) => {
      if (!n.isMesh) return;
      const b = vbox(n);
      out.weaponMeshes.push({ name: n.name || n.parent?.name || "?", box: b });
    });
    out.weaponProfileZ = profile(parts.weapon, 2, 16);
  }
  if (parts.weaponSub) {
    parts.weaponSub.updateWorldMatrix(true, false);
    const wp = new THREE.Vector3().setFromMatrixPosition(parts.weaponSub.matrixWorld);
    out.weaponSub = { world: [wp.x, wp.y, wp.z], box: vbox(parts.weaponSub) };
  }
  for (const [name, node] of Object.entries(parts.aux || {})) {
    out.aux[name] = { pos: [node.position.x, node.position.y, node.position.z], box: vbox(node) };
  }
  out.profileZ = profile(parts.body, 2, 24);
  out.profileY = profile(parts.body, 1, 16);
  window.__last = out;
  return out;
};

// Pose the weapon pivot at an angle about its axis and report where the arm
// reaches. Used to pick restAngle/fireAngle in GAME space with the model grounded.
window.__armAt = (angle) => {
  const spec = current.spec;
  const axis = spec.weapon.axis || { x: 1, y: 0, z: 0 };
  const a = new THREE.Vector3(axis.x, axis.y, axis.z).normalize();
  current.parts.weapon.quaternion.setFromAxisAngle(a, angle);
  current.parts.weapon.updateMatrixWorld(true);
  const b = vbox(current.parts.weapon);
  return { angle, box: b };
};

// Pose a nested sub-part (a grappler's jaw, a saw disc) at an angle about the
// weapon axis, so a rest pose can be chosen by measurement like an arm's.
// The weapon's lowest drawn vertex. A hinge is often "the round boss at the
// bottom of the part", and that is easier to point at than to eyeball.
window.__lowest = () => {
  let best = null;
  eachVertex(current.parts.weapon, (v) => {
    if (!best || v.y < best[1]) best = [v.x, v.y, v.z];
  });
  return best;
};

window.__subAt = (angle) => {
  const sub = current.parts.weaponSub;
  if (!sub) return null;
  const axis = current.spec.weapon.axis || { x: 1, y: 0, z: 0 };
  const a = new THREE.Vector3(axis.x, axis.y, axis.z).normalize();
  sub.quaternion.setFromAxisAngle(a, angle);
  sub.updateMatrixWorld(true);
  return { angle, box: vbox(sub) };
};

// Draw the catalog colliders as wireframes so a screenshot shows fit directly.
window.__colliders = (show) => {
  overlays.clear();
  if (!show || !current) return;
  const mat = new THREE.MeshBasicMaterial({ color: 0x36ff8a, wireframe: true, transparent: true, opacity: 0.85 });
  for (const c of current.spec.colliders || []) {
    let geo = null;
    const h = c.halfExtents || { x: 0.2, y: 0.2, z: 0.2 };
    if (c.shape === "cylinder") {
      geo = new THREE.CylinderGeometry(c.radius, c.radius, c.halfHeight * 2, 16);
    } else if (c.shape === "wedge") {
      // Triangular prism, vertex-for-vertex what sim/vehicle.js hulls: flat on
      // the floor, top climbing from a knife edge at -Z to full height at +Z.
      const tipY = c.tipY ?? 0;
      const v = [];
      for (const sx of [-1, 1]) {
        v.push(sx * h.x, -h.y, -h.z, sx * h.x, -h.y + tipY, -h.z, sx * h.x, -h.y, h.z, sx * h.x, h.y, h.z);
      }
      geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(v, 3));
      geo.setIndex([0,1,3, 0,3,2, 4,7,5, 4,6,7, 0,2,6, 0,6,4, 1,7,3, 1,5,7, 2,3,7, 2,7,6, 0,4,5, 0,5,1]);
    } else {
      geo = new THREE.BoxGeometry(h.x * 2, h.y * 2, h.z * 2);
    }
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(c.offset.x, c.offset.y, c.offset.z);
    overlays.add(mesh);
  }
};

// Tint the rig so a screenshot says which mesh the loader treated as what:
// weapon red, nested sub orange, wheels blue, aux green, body untouched.
window.__tint = (on) => {
  if (!current) return;
  const paint = (root, color) => root.traverse((c) => {
    if (!c.isMesh) return;
    if (on) {
      if (!c.userData.__mat) c.userData.__mat = c.material;
      c.material = new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.2 });
    } else if (c.userData.__mat) {
      c.material = c.userData.__mat;
    }
  });
  if (current.parts.weapon) paint(current.parts.weapon, 0xd83a3a);
  if (current.parts.weaponSub) paint(current.parts.weaponSub, 0xffa02a);
  current.parts.wheels.forEach((w) => paint(w, 0x3a6fd8));
  for (const node of Object.values(current.parts.aux || {})) paint(node, 0x3ad86f);
};

// Draw the weapon's spin axis and swept circle where the sim will use them.
window.__sweep = (on) => {
  if (!current?.parts.weapon) return;
  if (!on) return;
  const spec = current.spec;
  const p = current.parts.weapon.position;
  const axis = new THREE.Vector3(spec.weapon.axis?.x ?? 1, spec.weapon.axis?.y ?? 0, spec.weapon.axis?.z ?? 0).normalize();
  const r = spec.weapon.radius || 0.5;
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(r, 0.012, 6, 64),
    new THREE.MeshBasicMaterial({ color: 0x36ff8a }),
  );
  ring.position.copy(p);
  ring.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), axis);
  overlays.add(ring);
  const hub = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffe14a }));
  hub.position.copy(p);
  overlays.add(hub);
};

// Highlight one segmentation part by name (tripo_part_N) and grey the rest.
// This is the view that settles "is modelWeapon holding the right geometry",
// which is the single most common way a bot's rig comes out wrong.
window.__part = (name, mode = "highlight") => {
  if (!current) return;
  const grey = new THREE.MeshStandardMaterial({ color: 0x3a3f47, roughness: 0.8, metalness: 0.1 });
  const hot = new THREE.MeshStandardMaterial({ color: 0xff3b30, roughness: 0.4, metalness: 0.3 });
  current.group.traverse((c) => {
    if (!c.isMesh) return;
    const hit = c.name === name || c.parent?.name === name;
    if (mode === "solo") c.visible = hit;
    else { c.visible = true; c.material = hit ? hot : grey; }
  });
};

// Every mesh name in the loaded rig, and which loader part owns it.
window.__parts = () => {
  const out = [];
  const walk = (root, owner) => root?.traverse((c) => {
    if (c.isMesh) out.push({ name: c.name || "?", owner });
  });
  walk(current.parts.body, "body");
  walk(current.parts.weapon, "weapon");
  current.parts.wheels.forEach((w, i) => walk(w, `wheel${i}`));
  for (const [k, v] of Object.entries(current.parts.aux || {})) walk(v, `aux:${k}`);
  return out;
};

// Show only part of the rig: "weapon" hides everything but modelWeapon, etc.
window.__solo = (what) => {
  if (!current) return;
  const p = current.parts;
  const set = (n, v) => { if (n) n.visible = v; };
  set(p.body, what === "all" || what === "body");
  set(p.weapon, what === "all" || what === "weapon");
  p.wheels.forEach((w) => set(w, what === "all" || what === "wheels"));
  for (const n of Object.values(p.aux || {})) set(n, what === "all" || what === "aux");
};

const VIEWS = {
  side: [1.0, 0.10, 0.0],      // looking from the bot's right (+X)
  front: [0.0, 0.12, -1.0],    // looking at the nose (-Z)
  back: [0.0, 0.12, 1.0],
  iso: [0.85, 0.45, -0.85],
  top: [0.001, 1, 0.001],
  low: [0.6, -0.12, -0.8],
};
window.__view = (name, zoom = 1) => {
  const b = new THREE.Box3().setFromObject(current.group);
  const size = new THREE.Vector3(); b.getSize(size);
  const center = new THREE.Vector3(); b.getCenter(center);
  const radius = size.length() * 0.62;
  const d = VIEWS[name] || VIEWS.iso;
  const dir = new THREE.Vector3(d[0], d[1], d[2]).normalize();
  camera.position.copy(center).addScaledVector(dir, radius * 2.0 * zoom);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
};
window.__grid = (on) => { grid.visible = on; ax.visible = on; };
window.__ready = true;
</script>
</body>
</html>
